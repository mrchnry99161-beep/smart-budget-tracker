<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Student Budget Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f4f8; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; }
    .header { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 24px 20px; text-align: center; }
    .header h1 { margin: 0 0 8px; font-size: 1.4rem; }
    .balance-box { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 14px; margin-top: 12px; }
    .balance-label { font-size: 0.85rem; opacity: 0.9; }
    .balance-amount { font-size: 2rem; font-weight: bold; margin: 4px 0; }
    .content { padding: 20px; }
    .section-title { font-size: 0.95rem; font-weight: 700; color: #475569; margin: 16px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; }
    input, select { flex: 1; }
    button { background: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
    .stat-title { font-size: 0.78rem; color: #64748b; }
    .stat-value { font-size: 1.15rem; font-weight: 700; color: #0f172a; margin-top: 4px; }
    .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 999px; overflow: hidden; margin: 8px 0; }
    .progress-bar-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s; }
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #e0e7ff; color: #1d4ed8; margin-right: 6px; }
    .delete-btn { background: #ef4444; padding: 4px 8px; font-size: 0.75rem; margin-left: 8px; }
    .delete-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Smart Budget Tracker</h1>
    <div class="balance-box">
      <div class="balance-label">Remaining Savings (Allowance - Expenses)</div>
      <div class="balance-amount" id="remainingBalance">₱0.00</div>
    </div>
  </div>

  <div class="content">
    <div class="section-title">1. Set Daily / Weekly Allowance</div>
    <div class="input-group">
      <input type="number" id="allowanceInput" placeholder="Enter allowance (e.g. 500)" min="0" />
      <button class="btn-green" onclick="setAllowance()">Set</button>
    </div>

    <div class="section-title">2. Add Expense</div>
    <div class="input-group">
      <input type="text" id="expenseName" placeholder="Item (e.g. Lunch)" />
      <select id="expenseCategory">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="School">School</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="input-group">
      <input type="number" id="expenseAmount" placeholder="Cost (₱)" min="0" />
      <button onclick="addExpense()">Add Expense</button>
    </div>

    <div class="section-title">3. Math & Statistics Summary</div>
    <div class="stat-title">Budget Used: <strong id="percentUsed">0%</strong></div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Allowance</div>
        <div class="stat-value" id="totalAllowance">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Spent (Addition)</div>
        <div class="stat-value" id="totalSpent">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Average Expense</div>
        <div class="stat-value" id="avgExpense">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Highest Expense</div>
        <div class="stat-value" id="highestExpense">₱0.00</div>
      </div>
    </div>

    <div class="section-title">Expense History</div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</div>

<script>
  let allowance = 0;
  let expenses = [];

  function setAllowance() {
    const val = parseFloat(document.getElementById('allowanceInput').value);
    if (!isNaN(val) && val >= 0) {
      allowance = val;
      document.getElementById('allowanceInput').value = '';
      updateDashboard();
    }
  }

  function addExpense() {
    const name = document.getElementById('expenseName').value.trim();
    const category = document.getElementById('expenseCategory').value;
    const amount = parseFloat(document.getElementById('expenseAmount').value);

    if (name !== '' && !isNaN(amount) && amount > 0) {
      expenses.push({ id: Date.now(), name, category, amount });
      document.getElementById('expenseName').value = '';
      document.getElementById('expenseAmount').value = '';
      updateDashboard();
    }
  }

  function deleteExpense(id) {
    expenses = expenses.filter(item => item.id !== id);
    updateDashboard();
  }

  function updateDashboard() {
    // 1. Addition: Sum of all expenses
    const totalSpent = expenses.reduce((sum, item) => sum + item.amount, 0);

    // 2. Subtraction: Remaining savings
    const remaining = allowance - totalSpent;

    // 3. Percentages: Share of allowance spent
    const percent = allowance > 0 ? ((totalSpent / allowance) * 100).toFixed(1) : 0;

    // 4. Averages: Mean expense per transaction
    const average = expenses.length > 0 ? (totalSpent / expenses.length) : 0;

    // 5. Statistics: Highest single expense
    const highest = expenses.length > 0 ? Math.max(...expenses.map(e => e.amount)) : 0;

    // Update UI
    document.getElementById('totalAllowance').innerText = `₱${allowance.toFixed(2)}`;
    document.getElementById('totalSpent').innerText = `₱${totalSpent.toFixed(2)}`;
    document.getElementById('remainingBalance').innerText = `₱${remaining.toFixed(2)}`;
    document.getElementById('percentUsed').innerText = `${percent}%`;
    document.getElementById('avgExpense').innerText = `₱${average.toFixed(2)}`;
    document.getElementById('highestExpense').innerText = `₱${highest.toFixed(2)}`;

    const bar = document.getElementById('progressBar');
    bar.style.width = `${Math.min(percent, 100)}%`;
    bar.style.backgroundColor = percent > 100 ? '#ef4444' : '#2563eb';

    // Render list
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    expenses.forEach(item => {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `
        <div><span class="badge">${item.category}</span>${item.name}</div>
        <div><strong>₱${item.amount.toFixed(2)}</strong><button class="delete-btn" onclick="deleteExpense(${item.id})">X</button></div>
      `;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
